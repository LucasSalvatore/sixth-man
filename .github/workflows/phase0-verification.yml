name: Phase 0 verification

on:
  pull_request:
    branches: [claude/deep-bench-nextjs-scaffold-rak0q5]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4100
      AUDIT_BASE_URL: http://127.0.0.1:4100
      AUDIT_OUTPUT_DIR: artifacts/phase0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check-data
      - run: npm run lint
      - run: npm run build
      - name: Start the production server
        id: server
        run: |
          mkdir -p artifacts/phase0
          npm start -- -H 127.0.0.1 -p 4100 > artifacts/phase0/server.log 2>&1 &
          echo "$!" > artifacts/phase0/server.pid
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(process.env.AUDIT_BASE_URL, { signal: AbortSignal.timeout(1000) });
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw new Error('Production server did not become ready');
          JS
      - name: Run the complete Playwright suite
        run: npm test -- --workers=2
      - name: Capture desktop and mobile evidence
        if: always() && steps.server.outcome == 'success'
        run: npm run screenshots:phase0
      - name: Audit the production build
        if: always() && steps.server.outcome == 'success'
        run: node scripts/audit-phase0.mjs
      - name: Upload raw verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/phase0/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop the production server
        if: always()
        run: |
          if test -f artifacts/phase0/server.pid; then
            kill "$(cat artifacts/phase0/server.pid)" || true
          fi
